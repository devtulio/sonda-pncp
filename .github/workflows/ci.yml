name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # a sonda mede com curl.exe do Windows; os testes rodam o curl de verdade
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # sonda_core.py, sonda_relatorio.py e os testes só usam a stdlib (pystray/Pillow/winotify são da bandeja)
      - run: python -m unittest discover -s tests -v

  qualidade:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install -r requirements-dev.txt

      # o ruff pega o .pyw via extend-include (pyproject.toml)
      - run: ruff check .

      # o bandit -r não olha .pyw: os arquivos vão por nome
      - run: bandit -q -c pyproject.toml sonda_core.py sonda_relatorio.py sonda_pncp.pyw
